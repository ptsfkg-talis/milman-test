<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мотиваційний профіль особистості (В. Мільман)</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2433;--mu:#667085;--bd:#e3e7ef;--ac:#4f46e5;--ac2:#0ea5a4;--acs:#eef0ff;--ok:#16a34a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1320;--card:#181d2e;--tx:#e8ebf5;--mu:#98a2b8;--bd:#2a3150;--ac:#8b86ff;--ac2:#2dd4bf;--acs:#232a4a}}
:root[data-theme="dark"]{--bg:#0f1320;--card:#181d2e;--tx:#e8ebf5;--mu:#98a2b8;--bd:#2a3150;--ac:#8b86ff;--ac2:#2dd4bf;--acs:#232a4a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:760px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.5rem;margin:8px 0 4px}h2{font-size:1.1rem;margin:0 0 14px;line-height:1.4}
.mu{color:var(--mu);font-size:.92rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;margin-top:16px;box-shadow:0 1px 2px rgba(20,30,60,.05)}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:12px 22px;font:600 1rem inherit;font-family:inherit;cursor:pointer}
.btn.g{background:var(--acs);color:var(--ac)}.btn:disabled{opacity:.4;cursor:not-allowed}
.bar{height:8px;background:var(--bd);border-radius:99px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:99px;transition:width .6s}
.q{padding:14px 0;border-top:1px solid var(--bd)}.q:first-of-type{border-top:0}
.q p{margin:0 0 8px}.q.miss{background:rgba(220,38,38,.07);border-radius:10px;padding-left:8px}
.o{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.o button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 2px;font:.8rem/1.2 inherit;font-family:inherit;cursor:pointer;min-height:40px}
.o button.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.row{margin:14px 0}.row b{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.tag{display:inline-block;background:var(--acs);color:var(--ac);border-radius:99px;padding:3px 10px;font-size:.85rem;font-weight:600;margin:2px 4px 2px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big{font-size:2rem;font-weight:700}
@media(max-width:520px){.two{grid-template-columns:1fr}.o button{font-size:.72rem}}
body.rb{background:linear-gradient(135deg,#ffc933,#f59a3b) fixed;color:#12305a}body.rb .w{max-width:1040px}
.rh{font-size:clamp(1.6rem,4vw,2.4rem);font-weight:800;margin:6px 0 2px;color:#12305a}.rs{font-size:.85rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#12305a}
.rg{display:grid;grid-template-columns:1.25fr 1fr;gap:20px;margin-top:16px;align-items:start}
.rc{background:#fff;border-radius:24px;padding:16px;color:#12305a}.rp h3{font-size:1.25rem;margin:0 0 8px;color:#12305a}.rp ol{margin:0 0 24px;padding-left:20px;font-size:1.05rem}
.rb2{margin:12px 0}.rb2 b{display:flex;justify-content:space-between;gap:8px;font-weight:600}.rb2 u{display:block;height:11px;background:rgba(255,255,255,.55);margin-top:5px;text-decoration:none}.rb2 u i{display:block;height:100%}
.rn{color:#12305a;font-size:.9rem;margin:14px 0}.rf{font-size:.78rem;margin-top:18px;color:#12305a}
@media(max-width:760px){.rg{grid-template-columns:1fr}}
@media print{.nav,.noprint{display:none}}
</style>
</head>
<body>
<div class="w" id="app"></div>
<script>
var G=[{"t": "У своїй поведінці в житті потрібно дотримуватися таких принципів:", "s": ["«Час - гроші». Треба прагнути заробляти їх більше.", "«Головне - здоров’я». Потрібно берегти себе й свої нерви.", "Вільний час потрібно проводити з друзями.", "Вільний час потрібно присвячувати сім’ї.", "Потрібно робити добро, навіть якщо це дорого коштує.", "Потрібно робити все можливе, щоб здобути собі місце під сонцем.", "Потрібно здобувати більше знань, щоб зрозуміти причини й сутність того, що відбувається навколо.", "Потрібно прагнути відкрити щось нове, створити, винайти."]}, {"t": "У своїй поведінці на роботі потрібно керуватися такими принципами:", "s": ["Робота - це вимушена життєва необхідність.", "Головне - не допускати конфліктів.", "Потрібно прагнути створити для себе спокійні й зручні умови.", "Потрібно активно прагнути просування по службі.", "Головне - здобути авторитет і визнання.", "Потрібно постійно вдосконалюватися у своїй справі.", "У своїй роботі завжди треба знаходити щось цікаве, що може захопити.", "Потрібно не лише самому захопитися роботою, а й захопити нею інших."]}, {"t": "Серед моїх занять у вільний час значне місце посідають такі справи:", "s": ["Поточні справи, домашні клопоти.", "Відпочинок, розваги.", "Зустрічі з друзями.", "Громадські справи.", "Заняття з дітьми.", "Навчання, читання літератури, необхідної для роботи.", "Хобі.", "Додатковий заробіток."]}, {"t": "Серед моїх робочих справ значне місце посідають:", "s": ["Ділове спілкування (переговори, виступи, обговорення тощо).", "Особисте спілкування (на теми, не пов’язані з роботою).", "Громадська робота.", "Навчання, отримання нової інформації, підвищення кваліфікації.", "Творча робота.", "Робота, що безпосередньо впливає на заробіток (відрядна, додаткова).", "Робота, пов’язана з відповідальністю перед іншими.", "Вільний час, перекури, відпочинок."]}, {"t": "Якби мені додали ще один вихідний день, найімовірніше, я витратив/витратила б його на те, щоб:", "s": ["Займатися поточними домашніми справами.", "Відпочивати.", "Розважатися.", "Займатися громадською роботою.", "Навчатися, здобувати нові знання.", "Займатися творчою роботою.", "Виконувати справу, за яку відчуваєш відповідальність перед іншими.", "Виконувати роботу, що дає змогу заробити."]}, {"t": "Якби я міг/могла самостійно планувати свій робочий день, то найімовірніше займався/займалася б:", "s": ["Тим, що становить мої основні обов’язки.", "Спілкуванням із людьми у робочих справах (переговорами, обговореннями).", "Особистим спілкуванням (розмовами, не пов’язаними з роботою).", "Громадською роботою.", "Навчанням, здобуттям нових знань, підвищенням кваліфікації.", "Творчою роботою.", "Роботою, у якій відчуваєш свою корисність і відповідальність.", "Роботою, за яку можна більше заробити."]}, {"t": "Я часто розмовляю з друзями та знайомими на такі теми:", "s": ["Де що можна купити, як цікаво провести час.", "Про спільних знайомих.", "Про те, що бачу й чую навколо.", "Як досягти успіху в житті.", "Про роботу.", "Про свої захоплення.", "Про свої успіхи та плани.", "Про життя, книжки, кінофільми, політику."]}, {"t": "Моя робота дає мені насамперед:", "s": ["Достатні матеріальні засоби для життя.", "Спілкування з людьми, дружні стосунки.", "Авторитет і повага оточення.", "Цікаві зустрічі та бесіди.", "Задоволення від роботи.", "Відчуття власної корисності.", "Можливість підвищувати свій професійний рівень.", "Можливість просування по службі."]}, {"t": "Найбільше мені хотілося б бувати в такому товаристві, де:", "s": ["Затишно, є хороші розваги.", "Можна обговорити робочі теми, які тебе хвилюють.", "Тебе поважають і вважають авторитетом.", "Можна зустріти потрібних людей і зав’язати корисні знайомства.", "Можна знайти нових друзів.", "Присутні відомі й шановані люди.", "Усі об’єднані спільною справою.", "Можна виявити й розвинути свої здібності."]}, {"t": "Мені хотілося б працювати поруч із такими людьми:", "s": ["З якими можна поговорити на різні теми.", "Яким можна передавати свій досвід і знання.", "З якими можна більше заробляти.", "Які мають авторитет і вагу на роботі.", "Які можуть навчити чогось корисного.", "Які спонукають тебе активніше працювати.", "Які мають багато знань та цікавих ідей.", "Які готові підтримати тебе в різних ситуаціях."]}, {"t": "Наразі я достатньою мірою маю:", "s": ["Матеріальний добробут.", "Можливість цікаво розважатися.", "Хороші умови життя.", "Хорошу сім’ю.", "Достатньо можливостей цікаво проводити час у товаристві.", "Пошану, визнання та вдячність інших.", "Відчуття власної корисності для інших.", "Створення чогось цінного й корисного."]}, {"t": "Я вважаю, що у своїй роботі достатньою мірою маю:", "s": ["Хорошу зарплату, інші матеріальні блага.", "Хороші умови праці.", "Хороший колектив, дружні стосунки.", "Певні творчі досягнення.", "Хорошу посаду.", "Самостійність і незалежність.", "Авторитет і повагу колег.", "Достатньо високий професійний рівень."]}, {"t": "Найбільше мені подобається, коли:", "s": ["Не потрібно думати про нагальні клопоти.", "Є комфортне й приємне оточення.", "Навколо панують пожвавлення та весела метушня.", "Попереду - час у веселому товаристві.", "Відчуваю азарт змагання та пошуку.", "Відчуваю активне напруження й відповідальність.", "Повністю занурююся у свою роботу.", "Беру участь у спільній роботі з іншими."]}, {"t": "Коли мене спіткає невдача й не вдається досягти того, чого я хочу:", "s": ["Засмучуюся й довго переживаю.", "Намагаюся переключитися на щось інше, приємне.", "Розгублююся, не знаю, що робити, і серджуся на себе.", "Серджуся на те, що мені завадило.", "Намагаюся зберігати спокій, і зазвичай мені це вдається.", "Чекаю, поки мине перша реакція, а потім спокійно аналізую, що сталося.", "Намагаюся зрозуміти, у чому була моя провина.", "Намагаюся зрозуміти причини невдачі й виправити ситуацію."]}],S={"П": [[0, 0], [4, 0], [4, 7], [2, 0], [2, 7], [7, 4], [10, 0], [1, 0], [5, 7], [9, 2], [9, 4], [3, 5], [7, 0], [11, 0], [11, 7]], "К": [[4, 1], [4, 2], [8, 0], [8, 7], [2, 1], [6, 0], [10, 1], [10, 2], [1, 1], [1, 2], [5, 2], [9, 0], [3, 1], [3, 7], [11, 1], [11, 2]], "С": [[0, 5], [8, 2], [8, 3], [6, 2], [6, 3], [10, 4], [10, 5], [1, 3], [1, 4], [5, 3], [9, 3], [7, 7], [7, 2], [11, 4], [11, 5]], "О": [[0, 2], [8, 4], [8, 5], [2, 2], [6, 1], [6, 7], [10, 3], [10, 4], [1, 4], [5, 1], [5, 2], [9, 0], [3, 1], [7, 1], [7, 3], [11, 2]], "Д": [[0, 3], [4, 7], [8, 1], [8, 6], [2, 3], [2, 6], [6, 4], [5, 0], [5, 1], [5, 3], [9, 2], [3, 0], [11, 7]], "ДР": [[0, 7], [4, 4], [4, 5], [2, 6], [6, 5], [6, 6], [10, 7], [2, 5], [2, 6], [5, 5], [9, 6], [3, 4], [7, 4], [7, 6], [11, 3]], "ОД": [[0, 4], [4, 3], [4, 6], [8, 6], [2, 3], [10, 5], [10, 6], [2, 7], [5, 3], [9, 1], [9, 5], [3, 2], [3, 6], [7, 5], [11, 6]], "Еаст": [[12, 0], [12, 1], [12, 2], [12, 3]], "Фаст": [[13, 0], [13, 1], [13, 2], [13, 3]], "Ест": [[12, 4], [12, 5], [12, 6], [12, 7]], "Фст": [[13, 4], [13, 5], [13, 6], [13, 7]]};
var OPT=[["Так",3],["Скоріше так",2],["Частково",1],["Ні",0],["Не знаю",0]];
var A=G.map(function(g){return g.s.map(function(){return null})});
var step=-1,miss=false;
var N={"П":"Підтримання життєзабезпечення","К":"Комфорт","С":"Соціальний статус","О":"Спілкування","Д":"Ділова активність","ДР":"Творча активність","ОД":"Суспільна корисність"};
var app=document.getElementById("app");
function sc(a){return a.reduce(function(s,p){var v=A[p[0]][p[1]];return s+(v==null?0:OPT[v][1])},0)}
function pct(k){return Math.round(sc(S[k])/(S[k].length*3)*100)}
function start(){app.innerHTML='<h1>Мотиваційний профіль особистості</h1><p class="mu">Методика В. Е. Мільмана · 14 груп тверджень</p><div class="card"><p>Оцініть, наскільки ви погоджуєтеся з кожним твердженням. Відповідайте швидко, довго не роздумуючи. Усього 14 екранів по 8 тверджень — близько 10–15 хвилин. Результат з’явиться одразу після останнього екрана.</p><p class="mu">Тест анонімний: відповіді не зберігаються і нікуди не надсилаються.</p><button class="btn" onclick="go(0)">Почати</button></div>'}
function go(n){step=n;miss=false;render()}
function render(){
 var g=G[step],done=A.slice(0,step).length;
 var h='<div class="mu">Група '+(step+1)+' із '+G.length+'</div><div class="bar"><i style="width:'+(step/G.length*100)+'%"></i></div><div class="card"><h2>'+(step+1)+'. '+g.t+'</h2>';
 g.s.forEach(function(t,k){
  h+='<div class="q'+(miss&&A[step][k]==null?' miss':'')+'"><p>'+"АБВГДЕЖЗ".charAt(k)+'. '+t+'</p><div class="o">';
  OPT.forEach(function(o,i){h+='<button class="'+(A[step][k]===i?'on':'')+'" onclick="pick('+k+','+i+')">'+o[0]+'</button>'});
  h+='</div></div>'});
 h+='<div class="nav"><button class="btn g" '+(step?'':'disabled')+' onclick="go(step-1)">Назад</button><button class="btn" onclick="next()">'+(step==G.length-1?'Показати результат':'Далі')+'</button></div></div>';
 app.innerHTML=h;window.scrollTo(0,0)}
function pick(k,i){A[step][k]=i;var q=document.querySelectorAll(".q")[k];q.classList.remove("miss");q.querySelectorAll("button").forEach(function(b,j){b.className=j==i?"on":""})}
function next(){if(A[step].indexOf(null)>-1){miss=true;render();var m=document.querySelector(".miss");if(m)m.scrollIntoView({block:"center"});return}
 step==G.length-1?result():go(step+1)}
function bars(keys){return keys.map(function(k){var p=pct(k);return '<div class="row"><b><span>'+N[k]+'</span><span>'+p+'%</span></b><div class="bar"><i style="width:'+p+'%"></i></div><span class="mu">'+sc(S[k])+' з '+S[k].length*3+' балів</span></div>'}).join("")}
function pair(a,b,la,lb){var x=sc(S[a]),y=sc(S[b]),m=S[a].length*3;return '<div class="row"><b><span>'+la+'</span><span>'+x+'</span></b><div class="bar"><i style="width:'+x/m*100+'%"></i></div></div><div class="row"><b><span>'+lb+'</span><span>'+y+'</span></b><div class="bar"><i style="width:'+y/m*100+'%"></i></div></div>'}
var COL={"П":"#6a3f9e","К":"#9b6fd0","С":"#e0731c","О":"#f2b91a","Д":"#2b9edb","ДР":"#5cb6e8","ОД":"#3e9b45"};
var SH={"П":"Життєзабезпечення","К":"Комфорт","С":"Соціальний статус","О":"Спілкування","Д":"Ділова активність","ДР":"Творча активність","ОД":"Суспільна корисність"};
function pol(r,a){return [320+r*Math.cos(a),250+r*Math.sin(a)]}
function sec(a0,a1,r0,r1){var p=pol(r1,a0),q=pol(r1,a1),s=pol(r0,a1),t=pol(r0,a0);return 'M'+p+' A'+r1+' '+r1+' 0 0 1 '+q+' L'+s+' A'+r0+' '+r0+' 0 0 0 '+t+'Z'}
function wheel(){var O=["Д","ДР","ОД","О","С","К","П"],st=2*Math.PI/7,g=.05,v='<svg viewBox="0 0 640 500" width="100%" role="img" aria-label="Мотиваційне коло">';
 O.forEach(function(k,i){var a0=-Math.PI/2+i*st+g/2,a1=a0+st-g,p=pct(k),r1=90+(182-90)*p/100;
  v+='<path d="'+sec(a0,a1,84,192)+'" fill="'+COL[k]+'" opacity=".14"/><path d="'+sec(a0,a1,84,Math.max(r1,90))+'" fill="'+COL[k]+'"/>';
  var am=(a0+a1)/2,lp=pol(212,am),c=Math.cos(am),s=Math.sin(am),an=c>.3?'start':c<-.3?'end':'middle',dy=s<-.6?-8:s>.6?14:0;
  v+='<text x="'+lp[0]+'" y="'+(lp[1]+dy)+'" text-anchor="'+an+'" font-size="15" font-weight="700" fill="#12305a">'+SH[k]+'</text><text x="'+lp[0]+'" y="'+(lp[1]+dy+19)+'" text-anchor="'+an+'" font-size="16" font-weight="800" fill="'+COL[k]+'">'+p+'%</text>'});
 [[0,3,"Розвивальні","#2b9edb","#fff"],[3,4,"Спілкув.","#f2b91a","#12305a"],[4,7,"Підтримувальні","#6a3f9e","#fff"]].forEach(function(q){var b0=-Math.PI/2+q[0]*st+g/2,b1=-Math.PI/2+q[1]*st-g/2,bm=(b0+b1)/2,pm=pol(65,bm),dg=bm*180/Math.PI+90;if(Math.sin(bm)>0)dg+=180;
  v+='<path d="'+sec(b0,b1,52,78)+'" fill="'+q[3]+'"/><text transform="translate('+pm[0]+' '+pm[1]+') rotate('+dg+')" text-anchor="middle" dy="3.5" font-size="9.5" font-weight="800" fill="'+q[4]+'">'+q[2]+'</text>'});
 return v+'<circle cx="320" cy="250" r="44" fill="#12305a"/><text x="320" y="256" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">Ви</text></svg>'}
function rbar(l,p,c){return '<div class="rb2"><b><span>'+l+'</span><span>'+p+'%</span></b><u><i style="width:'+p+'%;background:'+c+'"></i></u></div>'}
function result(){document.body.className="rb";
 var K=Object.keys(N),sum=function(a){return a.reduce(function(s,k){return s+sc(S[k])},0)},mx=function(a){return a.reduce(function(s,k){return s+S[k].length*3},0)},
  sup=sum(["П","К","С"]),dev=sum(["Д","ДР","ОД"]),diff=dev-sup,top=K.slice().sort(function(a,b){return pct(b)-pct(a)}).slice(0,3),
  pc=function(a){return Math.round(sum(a)/mx(a)*100)};
 var h='<div class="rs">Методика В. Мільмана</div><div class="rh">Мій мотиваційний профіль</div><div class="rg"><div class="rc">'+wheel()+'</div><div class="rp"><h3>Провідні мотиви</h3><ol>'+top.map(function(k){return '<li>'+N[k]+' <b>'+pct(k)+'%</b></li>'}).join("")+'</ol><h3>Напрямки</h3>'
  +rbar("Розвивальні мотиви",pc(["Д","ДР","ОД"]),"#2b9edb")+rbar("Підтримувальні мотиви",pc(["П","К","С"]),"#6a3f9e")+rbar("Спілкування",pct("О"),"#f2b91a")
  +rbar("Стенічна спрямованість емоцій",Math.round(sc(S["Ест"])/12*100),"#3e9b45")+rbar("Стенічна реакція на невдачу",Math.round(sc(S["Фст"])/12*100),"#e0731c")
  +'<p class="rn">Розвивальні − підтримувальні: <b>'+(diff>0?'+':'')+diff+'</b>. '+(diff>=5?'Значення ≥ 5 за ключем означає досягнення успіху в роботі.':'Нижче порогового значення 5.')+'</p></div></div>'
  +interp(top,diff)+'<div class="rf">Відсотки — частка від максимуму шкали. Орієнтовний результат, не діагноз.</div><div class="nav noprint"><button class="btn g" onclick="location.reload()">Пройти ще раз</button><button class="btn" onclick="window.print()">Друк / PDF</button></div>';
 app.innerHTML=h;window.scrollTo(0,0)}
function interp(top,diff){var ep=Math.round(sc(S["Ест"])/12*100),fp=Math.round(sc(S["Фст"])/12*100),K=Object.keys(N).sort(function(a,b){return pct(a)-pct(b)}),
 L=function(p){return p<40?'переважає астенічна сторона':p>60?'переважає стенічна сторона':'виражені обидві сторони приблизно порівну'},
 b=diff>=5?'Розвивальні мотиви переважають над підтримувальними (різниця '+diff+' ≥ 5, поріг із ключа методики).':diff<=-5?'Підтримувальні мотиви переважають над розвивальними (різниця '+diff+').':'Розвивальні й підтримувальні мотиви майже збалансовані (різниця '+diff+', поріг — 5).',
 li=function(t,x){return '<li style="margin-bottom:10px"><b>'+t+'.</b> '+x+'</li>'};
 return '<div class="rc" style="margin-top:20px;padding:20px 24px"><h3 style="margin:0 0 12px">Як читати результат</h3><ol style="padding-left:20px;margin:0">'
 +li('Провідні мотиви','Найвищі шкали — «'+N[top[0]].toLowerCase()+'», «'+N[top[1]].toLowerCase()+'» і «'+N[top[2]].toLowerCase()+'». Саме вони найсильніше рухають вашою поведінкою. Найменш виражена шкала — «'+N[K[0]].toLowerCase()+'» ('+pct(K[0])+'%).')
 +li('Баланс мотивів',b+' Це положення відносно порога, а не оцінка якості.')
 +li('Емоційна спрямованість','Стенічної частки '+ep+'%: '+L(ep)+'. Астенічна сторона — тяжіння до спокою, затишку, приємного оточення; стенічна — до азарту, змагання й напруження. Межі 40% і 60% — орієнтовні.')
 +li('Реакція на невдачу','Стенічної частки '+fp+'%: '+L(fp)+'. Стенічний тип — спокійний аналіз і виправлення ситуації; астенічний — засмучення, розгубленість, роздратування.')
 +li('Обмеження','Це самооцінка за одне проходження, на неї можуть впливати поточні обставини. У таблиці методики немає норм для рівнів «високий/низький», тому висновки — це порівняння ваших шкал між собою, а не з вибіркою.')
 +'</ol></div>'}
function resultOld(){
 var K=Object.keys(N),sup=sc(S["П"])+sc(S["К"])+sc(S["С"]),dev=sc(S["Д"])+sc(S["ДР"])+sc(S["ОД"]),diff=dev-sup;
 var top=K.slice().sort(function(a,b){return pct(b)-pct(a)}).slice(0,3),low=K.slice().sort(function(a,b){return pct(a)-pct(b)})[0];

 h+='<div class="card"><h2>Сім шкал мотивації</h2>'+bars(K)+'</div>';
 h+='<div class="card"><h2>Підтримувальні та розвивальні мотиви</h2><div class="two"><div><div class="mu">Підтримувальні (життєзабезпечення + комфорт + статус)</div><div class="big">'+sup+'</div></div><div><div class="mu">Розвивальні (ділова + творча активність + суспільна корисність)</div><div class="big">'+dev+'</div></div></div><p>Різниця (розвивальні − підтримувальні): <b>'+(diff>0?'+':'')+diff+'</b>. '+(diff>=5?'За ключем таблиці значення ≥ 5 відповідає досягненню успіху в роботі: розвивальні мотиви переважають над підтримувальними.':diff>0?'Розвивальні мотиви трохи переважають, але різниця менша за порогове значення 5.':'Підтримувальні мотиви виражені не менше за розвивальні.')+'</p></div>';
 h+='<div class="card"><h2>Спрямованість на емоційні переживання</h2>'+pair("Еаст","Ест","Астенічна (спокій, затишок, розваги)","Стенічна (азарт, напруження, захоплення)")+'<p>Переважає <b>'+(e?'стенічна':'астенічна')+'</b> спрямованість.</p></div>';
 h+='<div class="card"><h2>Тип переживання фрустрації</h2>'+pair("Фаст","Фст","Астенічний (засмучення, розгубленість, гнів)","Стенічний (спокійний аналіз, виправлення ситуації)")+'<p>Переважає <b>'+(f?'стенічний':'астенічний')+'</b> тип реакції на невдачу.</p></div>';
 h+='<p class="mu">Результат орієнтовний, не є діагнозом і не замінює консультації психолога.</p><div class="nav noprint"><button class="btn g" onclick="location.reload()">Пройти ще раз</button><button class="btn" onclick="window.print()">Друк / PDF</button></div>';
 app.innerHTML=h;window.scrollTo(0,0)}
